
name: Build SnapLite Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (!$project) { throw "No se encontró el proyecto C#" }
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload SnapLite
        uses: actions/upload-artifact@v4
        with:
          name: SnapLite-Windows-x64
          path: publish/SnapLite.exe
